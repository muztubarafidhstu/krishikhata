<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>সংযোগ নেই</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#eef5e6;color:#1d2b17;font-family:"Noto Sans Bengali","Hind Siliguri",sans-serif;padding:24px;box-sizing:border-box}
  .card{background:#fff;border:1px solid #d5e3c8;border-radius:20px;padding:26px 22px;text-align:center;max-width:380px;width:100%}
  .ic{font-size:46px}
  h2{margin:8px 0}
  p{color:#5d6e55;line-height:1.6}
  button{width:100%;border:0;border-radius:14px;padding:14px;font-size:1.1rem;font-weight:700;margin-top:10px;font-family:inherit}
  .main{background:#2f8f3a;color:#fff;box-shadow:0 4px 0 #1f6b2a}
  .ghost{background:#f6faf1;color:#1d2b17;border:1px solid #d5e3c8}
</style>
</head>
<body>
<div class="card">
  <div class="ic">📶</div>
  <h2>ইন্টারনেট সংযোগ নেই</h2>
  <p>মোবাইল ডেটা বা WiFi চালু আছে কিনা দেখুন, তারপর আবার চেষ্টা করুন। আপনার সব হিসাব নিরাপদে সার্ভারে আছে।</p>
  <button class="main" onclick="window.KKAndroid && KKAndroid.retry()">আবার চেষ্টা করুন</button>
  <button class="ghost" onclick="window.KKAndroid && KKAndroid.changeShop()">অন্য দোকানের ঠিকানা দিন</button>
</div>
</body>
</html>
